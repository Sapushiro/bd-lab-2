name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: sapushiro/banknote-api:latest
  CONTAINER_NAME: banknote-api-cd

jobs:
  functional-tests:
    name: Run container and functional tests
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install functional test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx

      - name: Pull Docker image
        run: docker pull "${IMAGE_NAME}"

      - name: Start API container
        run: |
          docker run \
            --detach \
            --name "${CONTAINER_NAME}" \
            --publish 8000:8000 \
            "${IMAGE_NAME}"

      - name: Wait for API health check
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi

            echo "Waiting for API: attempt ${attempt}/30"
            sleep 2
          done

          echo "API did not become healthy"
          docker logs "${CONTAINER_NAME}"
          exit 1

      - name: Run functional tests
        run: |
          set -o pipefail
          python tests/run_scenario.py \
            | tee functional-test-results.txt

      - name: Upload functional test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-results
          path: functional-test-results.txt
          if-no-files-found: warn

      - name: Show container logs
        if: failure()
        run: docker logs "${CONTAINER_NAME}"

      - name: Stop API container
        if: always()
        run: |
          docker rm --force "${CONTAINER_NAME}" || true