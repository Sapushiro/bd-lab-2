services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: banknote-api:latest
    container_name: banknote-api-container
    ports:
      - "8000:8000"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s